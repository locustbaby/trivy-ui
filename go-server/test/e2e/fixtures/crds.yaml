# Minimal Trivy Operator CRDs used by the kwok E2E suite.
#
# Derived from the Trivy Operator CRDs (Apache-2.0,
# https://github.com/aquasecurity/trivy-operator) and trimmed for testing:
# `report` is schemaless so the seeder can create small synthetic payloads.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vulnerabilityreports.aquasecurity.github.io
spec:
  group: aquasecurity.github.io
  scope: Namespaced
  names:
    kind: VulnerabilityReport
    plural: vulnerabilityreports
    singular: vulnerabilityreport
    shortNames: [vuln, vulns]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---

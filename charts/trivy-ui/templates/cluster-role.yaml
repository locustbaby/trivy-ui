{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "trivy-ui.fullname" . }}
  labels:
    {{- include "trivy-ui.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - aquasecurity.github.io
    resources:
      - "*" 
    verbs:
      - get
      - list
      - watch
  {{- if .Values.rescan.enabled }}
  # Rescan deletes a report so the Trivy Operator scans the workload again.
  - apiGroups:
      - aquasecurity.github.io
    resources:
      {{- toYaml .Values.rescan.types | nindent 6 }}
    verbs:
      - delete
  {{- end }}
{{- end }}

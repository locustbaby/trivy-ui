{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "trivy-ui.fullname" . }}
  labels:
    {{- include "trivy-ui.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - aquasecurity.github.io
    resources:
      - "*" 
    verbs:
      - get
      - list
      - watch
  # Maps ReplicaSets to their Deployment and detects retired ReplicaSets
  # (scaled to zero); without it names are derived from the report name.
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - list
      - watch

{{- end }}

{{- if and .Values.rbac.create (eq .Values.dataAccess.mode "namespaces") -}}
{{- if .Values.rbac.inClusterName }}
{{- $cluster := index .Values.dataAccess.clusters .Values.rbac.inClusterName -}}
{{- if not $cluster }}{{ fail (printf "dataAccess.clusters.%s is required when rbac.inClusterName is set" .Values.rbac.inClusterName) }}{{ end }}
{{- if not $cluster.namespaces }}{{ fail (printf "dataAccess.clusters.%s.namespaces cannot be empty" .Values.rbac.inClusterName) }}{{ end }}
{{- range $namespace := $cluster.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "trivy-ui.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "trivy-ui.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "trivy-ui.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "trivy-ui.serviceAccountName" $ }}
    namespace: {{ include "trivy-ui.namespace" $ }}
{{- end }}
{{- end }}
{{- end }}

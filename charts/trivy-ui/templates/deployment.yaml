{{- if not (has .Values.auth.mode (list "none" "local")) }}
{{- fail "auth.mode must be one of: none, local" }}
{{- end }}
{{- if eq .Values.auth.mode "local" }}
{{- if ne .Values.auth.local.backend "file" }}
{{- fail "auth.local.backend must be file" }}
{{- end }}
{{- if or (empty .Values.auth.local.existingSecret) (empty .Values.auth.local.configKey) (empty .Values.auth.local.sessionSecretKey) }}
{{- fail "auth.local.existingSecret, auth.local.configKey and auth.local.sessionSecretKey are required when auth.mode=local" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trivy-ui.fullname" . }}
  labels:
    {{- include "trivy-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "trivy-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
        {{- if eq $.Values.auth.mode "local" }}
        checksum/trivy-ui-auth: {{ include "trivy-ui.authSecretChecksum" $ }}
        {{- end }}
        {{- if and $.Values.kubeconfigs.enabled $.Values.kubeconfigs.secretName }}
        checksum/trivy-ui-kubeconfigs: {{ include "trivy-ui.kubeconfigSecretChecksum" $ }}
        {{- end }}
      {{- else }}
      {{- if eq .Values.auth.mode "local" }}
      annotations:
        checksum/trivy-ui-auth: {{ include "trivy-ui.authSecretChecksum" . }}
        {{- if and .Values.kubeconfigs.enabled .Values.kubeconfigs.secretName }}
        checksum/trivy-ui-kubeconfigs: {{ include "trivy-ui.kubeconfigSecretChecksum" . }}
        {{- end }}
      {{- else }}
      {{- if and .Values.kubeconfigs.enabled .Values.kubeconfigs.secretName }}
      annotations:
        checksum/trivy-ui-kubeconfigs: {{ include "trivy-ui.kubeconfigSecretChecksum" . }}
      {{- end }}
      {{- end }}
      {{- end }}
      labels:
        {{- include "trivy-ui.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "trivy-ui.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            - name: AUTH_LOCAL_BACKEND
              value: {{ .Values.auth.local.backend | quote }}
            - name: AUTH_FILE_PATH
              value: {{ printf "/etc/trivy-ui/auth/%s" .Values.auth.local.configKey | quote }}
            - name: AUTH_SESSION_DURATION
              value: {{ .Values.auth.session.duration | quote }}
            - name: AUTH_COOKIE_SECURE
              value: {{ .Values.auth.session.cookieSecure | quote }}
            - name: DATA_ACCESS_MODE
              value: {{ .Values.dataAccess.mode | quote }}
            - name: DATA_ACCESS_MAX_WATCH_STREAMS
              value: {{ .Values.dataAccess.maxWatchStreams | quote }}
            - name: DATA_ACCESS_CLUSTERS
              value: {{ .Values.dataAccess.clusters | toJson | quote }}
            - name: CLUSTER_SOURCES
              value: {{ if .Values.clusterSources }}{{ .Values.clusterSources | toJson | quote }}{{ else }}""{{ end }}
            - name: CACHE_DETAIL_MAX_SIZE
              value: {{ .Values.cache.detail.maxSize | quote }}
            - name: CACHE_DETAIL_PERSIST
              value: {{ .Values.cache.detail.persist | quote }}
            - name: CACHE_DETAIL_TTL
              value: {{ .Values.cache.detail.ttl | quote }}
            - name: CACHE_DETAIL_STALE_RETENTION
              value: {{ .Values.cache.detail.staleRetention | quote }}
            - name: CACHE_SUMMARY_MAX_ENTRIES
              value: {{ .Values.cache.summary.maxEntries | quote }}
            - name: CACHE_SNAPSHOT_MAX_SIZE
              value: {{ .Values.cache.summary.snapshotMaxSize | quote }}
            - name: CACHE_QUERY_MAX_ENTRIES
              value: {{ .Values.cache.query.maxEntries | quote }}
            - name: CACHE_QUERY_MAX_SIZE
              value: {{ .Values.cache.query.maxSize | quote }}
            - name: CACHE_QUERY_TTL
              value: {{ .Values.cache.query.ttl | quote }}
            {{- if .Values.customErrorPage.enabled }}
            - name: ERROR_PAGE_CONFIG
              value: {{ include "trivy-ui.errorPageConfig" . | quote }}
            {{- end }}
            {{- if eq .Values.auth.mode "local" }}
            - name: AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.local.existingSecret }}
                  key: {{ .Values.auth.local.sessionSecretKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if eq .Values.auth.mode "local" }}
            - name: auth
              mountPath: /etc/trivy-ui/auth
              readOnly: true
            {{- end }}
            {{- if and .Values.kubeconfigs.enabled .Values.kubeconfigs.secretName }}
            - name: kubeconfigs
              mountPath: /kubeconfigs
            {{- end }}
            {{- if .Values.cache.enabled }}
            - name: cache
              mountPath: {{ .Values.cache.mountPath | default "/cache" }}
            {{- end }}
      volumes:
        {{- if eq .Values.auth.mode "local" }}
        - name: auth
          secret:
            secretName: {{ .Values.auth.local.existingSecret }}
        {{- end }}
        {{- if and .Values.kubeconfigs.enabled .Values.kubeconfigs.secretName }}
        - name: kubeconfigs
          secret:
            secretName: {{ .Values.kubeconfigs.secretName }}
        {{- end }}
        {{- if .Values.cache.enabled }}
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.cache.sizeLimit | default "1Gi" }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

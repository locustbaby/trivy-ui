name: Build and Scan Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Trigger on tags that match semantic versioning format (v0.0.1)
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: Unit & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: trivy-dashboard/package-lock.json

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Run Go tests
        working-directory: go-server
        run: go test ./...

      - name: Run Go race tests
        working-directory: go-server
        run: go test -race ./...

      - name: Run Go vet
        working-directory: go-server
        run: go vet ./...

      - name: Check Go formatting
        working-directory: go-server
        run: test -z "$(gofmt -l .)"

      - name: Run frontend checks
        working-directory: trivy-dashboard
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate Helm chart
        run: |
          helm lint charts/trivy-ui
          helm template trivy-ui charts/trivy-ui --set auth.mode=none >/tmp/trivy-ui-none.yaml
          helm template trivy-ui charts/trivy-ui --set auth.mode=local --set auth.local.existingSecret=trivy-ui-auth --set-string env.CORS_ALLOWED_ORIGINS=https://ui.example.com >/tmp/trivy-ui-local.yaml
          helm template trivy-ui charts/trivy-ui --set cache.enabled=false >/tmp/trivy-ui-cache-disabled.yaml
          helm template trivy-ui charts/trivy-ui --set cache.mountPath=/var/lib/trivy-ui >/tmp/trivy-ui-cache-custom.yaml
          helm template trivy-ui charts/trivy-ui --set rbac.create=false >/tmp/trivy-ui-rbac-disabled.yaml
          test "$(grep -c '^kind: ClusterRole$' /tmp/trivy-ui-none.yaml)" -eq 2
          test "$(grep -c '^kind: ClusterRoleBinding$' /tmp/trivy-ui-none.yaml)" -eq 2
          grep -A3 '^kind: ClusterRole$' /tmp/trivy-ui-none.yaml | grep -q '^  name: trivy-ui$'
          grep -A3 '^kind: ClusterRoleBinding$' /tmp/trivy-ui-none.yaml | grep -q '^  name: trivy-ui$'
          grep -A1 'name: AUTH_MODE' /tmp/trivy-ui-local.yaml | grep -q 'value: "local"'
          grep -A1 'name: CORS_ALLOWED_ORIGINS' /tmp/trivy-ui-local.yaml | grep -q 'value: "https://ui.example.com"'
          grep -A1 'name: DATA_PATH' /tmp/trivy-ui-cache-disabled.yaml | grep -q 'value: "/tmp/trivy-ui-data"'
          grep -q 'name: runtime-data' /tmp/trivy-ui-cache-disabled.yaml
          grep -q 'mountPath: "/tmp/trivy-ui-data"' /tmp/trivy-ui-cache-disabled.yaml
          grep -A1 'name: DATA_PATH' /tmp/trivy-ui-cache-custom.yaml | grep -q 'value: "/var/lib/trivy-ui"'
          grep -q 'mountPath: "/var/lib/trivy-ui"' /tmp/trivy-ui-cache-custom.yaml
          test "$(grep -c '^kind: ClusterRole$' /tmp/trivy-ui-rbac-disabled.yaml)" -eq 0
          test "$(grep -c '^kind: ClusterRoleBinding$' /tmp/trivy-ui-rbac-disabled.yaml)" -eq 0

  e2e-kwok:
    name: E2E (kwok)
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 25

    env:
      KWOK_VERSION: v0.7.0
      KWOK_KUBE_VERSION: v1.30.10
      KWOK_CLUSTER: trivy-ui-e2e
      E2E_BASE_URL: http://127.0.0.1:8099

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum

      - name: Install kwokctl
        run: |
          curl -fsSLo /usr/local/bin/kwokctl \
            "https://github.com/kubernetes-sigs/kwok/releases/download/${KWOK_VERSION}/kwokctl-linux-amd64"
          chmod +x /usr/local/bin/kwokctl
          kwokctl --version

      - name: Create kwok cluster (real kube-apiserver + etcd)
        run: |
          kwokctl create cluster --name "$KWOK_CLUSTER" \
            --runtime docker --timeout 5m
          # The kubeconfig under ~/.kwok references cert paths that only exist
          # inside the apiserver container; `get kubeconfig` emits a host-usable
          # one (rewritten cert paths + server address).
          kwokctl get kubeconfig --name "$KWOK_CLUSTER" > /tmp/kwok-kubeconfig.yaml
          echo "KUBECONFIG=/tmp/kwok-kubeconfig.yaml" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if kubectl get --raw=/readyz >/dev/null 2>&1; then
              echo "Kubernetes API ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Kubernetes API did not become ready"
          kubectl get --raw=/readyz || true
          docker ps -a
          exit 1

      - name: Apply Trivy Operator CRDs
        run: kubectl apply -f go-server/test/e2e/fixtures/crds.yaml

      - name: Build server binary
        working-directory: go-server
        run: go build -o /tmp/trivy-ui-server .

      - name: Start server against kwok cluster
        working-directory: go-server
        env:
          PORT: '8099'
          DATA_PATH: /tmp/trivy-ui-data
          STATIC_PATH: /tmp/trivy-ui-static # no UI assets needed for API e2e
        run: |
          mkdir -p "$DATA_PATH" "$STATIC_PATH"
          nohup /tmp/trivy-ui-server > /tmp/trivy-ui-server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$E2E_BASE_URL/readyz" || true)
            if [ "$code" = "200" ]; then echo "server ready"; exit 0; fi
            sleep 2
          done
          echo "::error::server did not become ready"
          tail -100 /tmp/trivy-ui-server.log
          exit 1

      - name: Seed reports and run E2E assertions
        working-directory: go-server
        run: go test -tags e2e -v -count=1 ./test/e2e/...

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== server log ==="
          tail -200 /tmp/trivy-ui-server.log || true
          echo "=== seeded CR counts ==="
          for r in vulnerabilityreports configauditreports exposedsecretreports clustervulnerabilityreports; do
            echo -n "$r: "; kubectl get "$r" -A --no-headers 2>/dev/null | wc -l || true
          done
          echo "=== clusters ==="
          curl -s "$E2E_BASE_URL/api/v1/clusters" | head -c 2000 || true
          echo
          echo "=== overview ==="
          curl -s "$E2E_BASE_URL/api/v1/overview" | head -c 2000 || true

      - name: Teardown kwok cluster
        if: always()
        run: kwokctl delete cluster --name "$KWOK_CLUSTER" || true

  build-and-scan:
    runs-on: ubuntu-latest
    needs: [tests, e2e-kwok]
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract branch or tag name and set version
        id: extract_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref }}
        run: |
          # First, determine the Docker tag
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BRANCH_NAME="$HEAD_REF"
            BRANCH_NAME=$(echo "${BRANCH_NAME}" | sed 's|/|-|g')
            TIMESTAMP=$(date -u +"%Y%m%d-%H%M")
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG_NAME="${BRANCH_NAME}-${TIMESTAMP}-${SHORT_SHA}"
          elif [[ "$REF_NAME" == refs/heads/* ]]; then
            BRANCH_NAME=$(echo "$REF_NAME" | sed 's|refs/heads/||')
            BRANCH_NAME=$(echo "${BRANCH_NAME}" | sed 's|/|-|g')
            TIMESTAMP=$(date -u +"%Y%m%d-%H%M")
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG_NAME="${BRANCH_NAME}-${TIMESTAMP}-${SHORT_SHA}"
          elif [[ "$REF_NAME" == refs/tags/* ]]; then
            TAG_NAME=$(echo "$REF_NAME" | sed 's|refs/tags/||')
          else
            TAG_NAME="latest"
          fi
          echo "TAG=$TAG_NAME" >> $GITHUB_ENV
          echo "Docker Tag: $TAG_NAME"

          # Now, determine the version for the build
          if [[ "$REF_NAME" == refs/tags/* ]]; then
            # If this is a tag push, use the tag as the version (without the 'v' prefix for semantic version)
            VERSION=$(echo "$REF_NAME" | sed 's|refs/tags/v||')
          else
            # For non-tag builds, use a development version based on date and commit
            TIMESTAMP=$(date -u +"%Y%m%d")
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="0.0.0-dev.${TIMESTAMP}.${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Build Version: $VERSION"

      - name: Build amd64 Docker Image for Scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: trivy-ui:${{ env.TAG }}-scan
          build-args: |
            VERSION=${{ env.VERSION }}

      - name: Run Trivy Scan (Before Pushing)
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'trivy-ui:${{ env.TAG }}-scan'
          format: 'json'
          output: trivy-result.json
          ignore-unfixed: true
          exit-code: 0
          severity: 'CRITICAL,HIGH'

      - name: Check Trivy Scan Result
        id: check_trivy
        run: |
          echo "=== Trivy Scan Summary ==="
          jq -r '.Results[]? | select(.Vulnerabilities != null) | .Target as $target | .Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH") | "\(.Severity)\t\(.VulnerabilityID)\t\($target)\t\(.PkgName)\t\(.InstalledVersion)"' trivy-result.json 2>/dev/null | head -50 || true
          echo "========================="
          VULN_COUNT=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' trivy-result.json 2>/dev/null || echo "0")
          echo "Vulnerability count (CRITICAL+HIGH): $VULN_COUNT"
          if [ "$VULN_COUNT" -gt 0 ] 2>/dev/null; then
            echo "found_vuln=true" >> $GITHUB_OUTPUT
            echo "::error::Found $VULN_COUNT CRITICAL/HIGH vulnerabilities. Failing build."
            exit 1
          else
            echo "found_vuln=false" >> $GITHUB_OUTPUT
          fi

      - name: Smoke test the production image
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            --entrypoint /app/go-server trivy-ui:${{ env.TAG }}-scan \
            hash-password smoke-test >/tmp/trivy-ui-password-hash
          test -s /tmp/trivy-ui-password-hash

      - name: Build arm64 Docker Image for Scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/arm64
          tags: trivy-ui:${{ env.TAG }}-arm64-scan
          build-args: |
            VERSION=${{ env.VERSION }}

      - name: Run Trivy Scan for arm64 Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'trivy-ui:${{ env.TAG }}-arm64-scan'
          format: 'json'
          output: trivy-arm64-result.json
          ignore-unfixed: true
          exit-code: 1
          severity: 'CRITICAL,HIGH'

      - name: Set Docker tags
        id: docker_meta
        if: github.event_name != 'pull_request'
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # For tag pushes, set both the specific version tag and latest
            echo "DOCKER_TAGS=${{ secrets.DOCKERHUB_USERNAME }}/trivy-ui:${{ env.TAG }},${{ secrets.DOCKERHUB_USERNAME }}/trivy-ui:latest" >> $GITHUB_ENV
          else
            # For other pushes, just use the specific tag
            echo "DOCKER_TAGS=${{ secrets.DOCKERHUB_USERNAME }}/trivy-ui:${{ env.TAG }}" >> $GITHUB_ENV
          fi

      - name: Build and Push Multi-Architecture Docker Image
        id: docker_build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.DOCKER_TAGS }}
          build-args: |
            VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Inspect image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/trivy-ui:${{ env.TAG }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Multi-Architecture Docker Image Build Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "- **Images:**" >> $GITHUB_STEP_SUMMARY
            echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/trivy-ui:${{ env.TAG }}" >> $GITHUB_STEP_SUMMARY
            echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/trivy-ui:latest" >> $GITHUB_STEP_SUMMARY
            echo "- **Version:** ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Image:** ${{ secrets.DOCKERHUB_USERNAME }}/trivy-ui:${{ env.TAG }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Development Version:** ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "- **Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** ${{ steps.docker_build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run with: \`docker run -v ~/.kube:/root/.kube -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/trivy-ui:${{ env.TAG }}\`" >> $GITHUB_STEP_SUMMARY

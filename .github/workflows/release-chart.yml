name: Release Helm Chart

on:
  push:
    tags:
      - 'chart-v*'

concurrency:
  group: chart-oci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: |
          helm lint charts/trivy-ui/

      - name: Verify chart release tag and versions
        env:
          CHART_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$CHART_TAG" =~ ^chart-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Chart release tag must match chart-vX.Y.Z, got: $CHART_TAG"
            exit 1
          fi
          CHART_VERSION="${CHART_TAG#chart-v}"
          test "$(helm show chart charts/trivy-ui/ | awk '/^version:/{print $2}')" = "$CHART_VERSION"
          test "$(helm show chart charts/trivy-ui/ | awk '/^appVersion:/{gsub(/\"/, "", $2); print $2}')" = "v$CHART_VERSION"

      - name: Package chart
        run: |
          helm package charts/trivy-ui/
          ls -la *.tgz

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub Helm Registry
        run: |
          # Push chart to Docker Hub Helm registry
          helm push trivy-ui-*.tgz oci://registry-1.docker.io/locustbaby
          echo "Chart pushed to Docker Hub: oci://registry-1.docker.io/locustbaby/trivy-ui"



      - name: Output chart URLs
        run: |
          echo "Chart published to Docker Hub: oci://registry-1.docker.io/locustbaby/trivy-ui"
          echo "Chart package: $(ls *.tgz)"
          echo ""
          echo "Users can install with:"
          echo "helm install my-trivy-ui oci://registry-1.docker.io/locustbaby/trivy-ui"

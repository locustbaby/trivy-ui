name: Release Helm Chart

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: chart-oci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: |
          helm lint charts/trivy-ui/

      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "v$(helm show chart charts/trivy-ui/ | awk '/^version:/{print $2}')" = "$RELEASE_TAG"
          test "$(helm show chart charts/trivy-ui/ | awk '/^appVersion:/{gsub(/\"/, "", $2); print $2}')" = "$RELEASE_TAG"

      - name: Package chart
        run: |
          helm package charts/trivy-ui/
          ls -la *.tgz

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub Helm Registry
        run: |
          # Push chart to Docker Hub Helm registry
          helm push trivy-ui-*.tgz oci://registry-1.docker.io/locustbaby
          echo "Chart pushed to Docker Hub: oci://registry-1.docker.io/locustbaby/trivy-ui"



      - name: Output chart URLs
        run: |
          echo "Chart published to Docker Hub: oci://registry-1.docker.io/locustbaby/trivy-ui"
          echo "Chart package: $(ls *.tgz)"
          echo ""
          echo "Users can install with:"
          echo "helm install my-trivy-ui oci://registry-1.docker.io/locustbaby/trivy-ui"
